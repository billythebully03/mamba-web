
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Membu Labs</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @font-face {
      font-family: "Super Bubble";
      src: url("./Super Bubble.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --accent: #6A2FE7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      scrollbar-width: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    /* HEADER */

    .header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      height: calc(76px + env(safe-area-inset-top));
      padding: calc(22px + env(safe-area-inset-top)) 20px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: linear-gradient(
        to bottom,
        #000 38%,
        rgba(0,0,0,.96) 60%,
        rgba(0,0,0,.72) 78%,
        transparent
      );
    }

    /* BRAND */

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 32px;
      pointer-events: none;
    }

    .brand-word {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      height: 32px;
      overflow: hidden;
      transition: width .72s cubic-bezier(.16, 1, .3, 1);
    }

    .intro-text {
      display: flex;
      align-items: center;
      height: 32px;
      white-space: nowrap;
      color: var(--accent);
      font: 22px/1 "Super Bubble", sans-serif;
      transition:
        opacity .58s ease,
        filter .72s ease,
        transform .72s ease;
    }

    .intro-text span,
    .brand-label span {
      display: inline-block;
      opacity: 0;
      transform: translateY(4px);
      filter: blur(2px);
      animation: letter-in .4s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i) * 30ms);
    }

    @keyframes letter-in {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .logo {
      position: absolute;
      left: 0;
      top: 50%;
      width: var(--logo-width, 30px);
      height: 30px;
      background: var(--accent);
      -webkit-mask: url("./membu.png") center / contain no-repeat;
      mask: url("./membu.png") center / contain no-repeat;
      opacity: 0;
      filter: blur(5px);
      transform: translateY(-50%) scale(.96);
      transition:
        opacity .72s ease,
        filter .72s ease,
        transform .72s cubic-bezier(.2, .8, .2, 1);
    }

    .brand-label {
      display: flex;
      align-items: center;
      height: 32px;
      white-space: nowrap;
      color: #fff;
      font: 22px/1 "Super Bubble", sans-serif;
    }

    .brand.finished .brand-word {
      width: var(--logo-width, 30px);
    }

    .brand.finished .intro-text {
      opacity: 0;
      filter: blur(8px);
      transform: translateX(-3px) scale(.985);
    }

    .brand.finished .logo {
      opacity: 1;
      filter: blur(0);
      transform: translateY(-50%) scale(1);
    }

    /* TELEGRAM AVATAR */

    .avatar {
      position: relative;
      display: block;
      width: 34px;
      height: 34px;
      padding: 1.5px;
      flex-shrink: 0;
      border: 0;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      padding: 2px;
      border-radius: 50%;
      background: #000;
      overflow: hidden;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .avatar.loaded .avatar-image {
      opacity: 1;
    }

    .avatar-placeholder {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #292929;
      animation: shimmer 1.4s ease-in-out infinite;
      pointer-events: none;
    }

    .avatar.loaded .avatar-placeholder {
      display: none;
    }

    @keyframes shimmer {
      50% { background: #383838; }
    }

    /* WELCOME HINT */

    .hint {
      position: fixed;
      z-index: 20;
      top: calc(66px + env(safe-area-inset-top));
      right: 20px;
      width: min(310px, calc(100vw - 40px));
      transform-origin: calc(100% - 16px) 0;
      opacity: 0;
      pointer-events: none;
      transform: scale(.72, .35);
      filter: blur(7px);
      visibility: hidden;
      transition:
        transform .68s cubic-bezier(.16, 1, .3, 1),
        opacity .28s ease,
        filter .55s ease,
        visibility .68s;
    }

    .hint.visible {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1, 1);
      filter: blur(0);
      visibility: visible;
    }

    .hint-glass {
      position: relative;
      padding: 17px 48px 17px 17px;
      min-height: 76px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 21px;
      overflow: visible;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.105),
          rgba(255,255,255,.045) 55%,
          rgba(255,255,255,.065)
        );

      -webkit-backdrop-filter: blur(22px) saturate(155%);
      backdrop-filter: blur(22px) saturate(155%);

      box-shadow:
        0 14px 42px rgba(0,0,0,.38),
        inset 0 1px 1px rgba(255,255,255,.17),
        inset 0 -1px 1px rgba(0,0,0,.18);
    }

    /* Rounded pointer */

    .hint-glass::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 12px;
      width: 14px;
      height: 14px;
      transform: rotate(45deg);
      border-left: 1px solid rgba(255,255,255,.16);
      border-top: 1px solid rgba(255,255,255,.16);
      border-radius: 3px 0 0 0;

      background: rgba(35,35,35,.76);
      -webkit-backdrop-filter: blur(22px) saturate(155%);
      backdrop-filter: blur(22px) saturate(155%);
    }

    .hint-text {
      position: relative;
      z-index: 1;
      font-size: 13px;
      line-height: 1.48;
      letter-spacing: -.01em;
      color: rgba(255,255,255,.94);
    }

    /* Close button — deliberately not glass */

    .hint-close {
      position: absolute;
      z-index: 2;
      top: 9px;
      right: 9px;
      width: 27px;
      height: 27px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: rgba(20,20,20,.78);
      color: rgba(255,255,255,.76);
      cursor: pointer;
      transition: background .18s ease, color .18s ease;
    }

    .hint-close:active {
      background: rgba(10,10,10,.95);
      color: #fff;
    }

    .hint-close svg {
      width: 13px;
      height: 13px;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
    }

    /* CONTENT */

    main {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(76px + env(safe-area-inset-top)) 20px 60px;
    }

    /* FOOTER */

    .footer {
      position: fixed;
      inset: auto 0 0;
      z-index: 10;
      padding: 0 20px calc(14px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.38);
      line-height: 1;
      pointer-events: none;
    }

    .footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="brand" id="brand">
      <div class="brand-word" id="brandWord">
        <span class="intro-text" id="introText">MEMBU</span>
        <span class="logo" id="logo"></span>
      </div>
      <span class="brand-label" id="brandLabel">LABS</span>
    </div>

    <button class="avatar" id="avatar" type="button" aria-label="Открыть приветствие">
      <div class="avatar-placeholder"></div>
      <div class="avatar-inner">
        <img id="avatarImage" class="avatar-image" alt="">
      </div>
    </button>
  </header>

  <aside class="hint" id="welcomeHint" role="status" aria-live="polite">
    <div class="hint-glass">
      <p class="hint-text">
        Мембу живет здесь, так что ты можешь обратиться к нему в любой момент
      </p>

      <button class="hint-close" id="hintClose" type="button" aria-label="Закрыть подсказку">
        <svg viewBox="0 0 16 16" fill="none">
          <path d="M4 4L12 12M12 4L4 12"/>
        </svg>
      </button>
    </div>
  </aside>

  <main></main>

  <footer class="footer">
    Сделано <a href="https://t.me/ibartyom" target="_blank" rel="noopener noreferrer">@ibartyom</a>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#000000");
      tg.setBackgroundColor("#000000");
    }

    // BRAND INTRO

    const brand = document.getElementById("brand");
    const brandWord = document.getElementById("brandWord");
    const introText = document.getElementById("introText");
    const brandLabel = document.getElementById("brandLabel");

    function splitLetters(element, text, offset = 0) {
      element.textContent = "";

      [...text].forEach((letter, index) => {
        const span = document.createElement("span");
        span.textContent = letter;
        span.style.setProperty("--i", index + offset);
        element.appendChild(span);
      });
    }

    async function startIntro() {
      await document.fonts.load('22px "Super Bubble"');

      splitLetters(introText, "MEMBU");
      splitLetters(brandLabel, "LABS", 6);

      const wordWidth = introText.getBoundingClientRect().width;
      brandWord.style.width = `${wordWidth}px`;

      const logoAsset = new Image();

      logoAsset.onload = () => {
        const width = 30 * logoAsset.naturalWidth / logoAsset.naturalHeight;
        brand.style.setProperty("--logo-width", `${width}px`);
      };

      logoAsset.src = "./membu.png";

      setTimeout(() => {
        brand.classList.add("finished");
      }, 2300);
    }

    startIntro();

    // TELEGRAM AVATAR

    const avatar = document.getElementById("avatar");
    const avatarImage = document.getElementById("avatarImage");
    const photoUrl = tg?.initDataUnsafe?.user?.photo_url;

    if (photoUrl) {
      avatarImage.onload = () => avatar.classList.add("loaded");
      avatarImage.onerror = () => avatar.classList.remove("loaded");
      avatarImage.src = photoUrl;
    }

    // WELCOME HINT

    const hint = document.getElementById("welcomeHint");
    const hintClose = document.getElementById("hintClose");

    let hintTimer;

    function openHint() {
      hint.classList.add("visible");
    }

    function closeHint() {
      hint.classList.remove("visible");
      clearTimeout(hintTimer);
    }

    // Show shortly after the intro begins to settle.
    hintTimer = setTimeout(openHint, 3100);

    // Avatar can reopen the hint.
    avatar.addEventListener("click", () => {
      if (hint.classList.contains("visible")) {
        closeHint();
      } else {
        openHint();
      }
    });

    hintClose.addEventListener("click", closeHint);
  </script>
</body>
</html>
