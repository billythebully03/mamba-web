
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Membu Labs</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @font-face {
      font-family: "Super Bubble";
      src: url("./Super Bubble.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --accent: #6A2FE7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      scrollbar-width: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::-webkit-scrollbar { display: none; }

    /* HEADER */

    .header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      height: calc(76px + env(safe-area-inset-top));
      padding: calc(22px + env(safe-area-inset-top)) 20px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: linear-gradient(to bottom, #000 38%, rgba(0,0,0,.96) 60%, rgba(0,0,0,.72) 78%, transparent);
    }

    /* BRAND */

    .brand {
      position: relative;
      display: flex;
      align-items: center;
      height: 32px;
      pointer-events: none;
    }

    .intro-word {
      display: flex;
      align-items: center;
      height: 32px;
      font-family: "Super Bubble", sans-serif;
      font-size: 22px;
      line-height: 1;
      color: var(--accent);
      white-space: nowrap;
    }

    .intro-word span {
      display: inline-block;
      opacity: 0;
      transform: translateY(5px);
      animation: letter-in .32s ease forwards;
      animation-delay: calc(var(--i) * 42ms);
    }

    .brand-label {
      margin-left: 8px;
      font-family: "Super Bubble", sans-serif;
      font-size: 22px;
      line-height: 1;
      color: #fff;
      white-space: nowrap;
      transition: transform .85s cubic-bezier(.2,.8,.2,1);
    }

    .logo {
      position: absolute;
      left: 0;
      top: 1px;
      width: 30px;
      height: 30px;
      background: var(--accent);
      -webkit-mask: url("./membu.png") center / contain no-repeat;
      mask: url("./membu.png") center / contain no-repeat;
      opacity: 0;
      filter: blur(5px);
      transition: opacity .7s ease, filter .7s ease;
    }

    .brand.finished .intro-word {
      opacity: 0;
      filter: blur(7px);
      transition: opacity .7s ease, filter .7s ease;
    }

    .brand.finished .logo {
      opacity: 1;
      filter: blur(0);
    }

    .brand.finished .brand-label {
      transform: translateX(-34px);
    }

    @keyframes letter-in {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* AVATAR */

    .avatar {
      position: relative;
      width: 34px;
      height: 34px;
      padding: 2px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      overflow: hidden;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      padding: 2px;
      border-radius: 50%;
      background: #000;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .avatar.loaded .avatar-image { opacity: 1; }

    .avatar-placeholder {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #292929;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    .avatar.loaded .avatar-placeholder { display: none; }

    @keyframes shimmer {
      50% { background: #383838; }
    }

    /* CONTENT */

    main {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(76px + env(safe-area-inset-top)) 20px 60px;
    }

    /* FOOTER */

    .footer {
      position: fixed;
      inset: auto 0 0;
      z-index: 10;
      padding: 0 20px calc(14px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.38);
      line-height: 1;
      pointer-events: none;
    }

    .footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
      pointer-events: auto;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="brand" id="brand">
      <div class="intro-word" id="introWord"></div>
      <div class="logo"></div>
      <span class="brand-label">LABS</span>
    </div>

    <div class="avatar" id="avatar">
      <div class="avatar-placeholder"></div>
      <div class="avatar-inner">
        <img id="avatarImage" class="avatar-image" alt="Аватар пользователя">
      </div>
    </div>
  </header>

  <main></main>

  <footer class="footer">
    Сделано <a href="https://t.me/ibartyom" target="_blank" rel="noopener noreferrer">@ibartyom</a>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#000000");
      tg.setBackgroundColor("#000000");
    }

    // INTRO

    const brand = document.getElementById("brand");
    const introWord = document.getElementById("introWord");

    [..."MEMBU"].forEach((letter, index) => {
      const span = document.createElement("span");
      span.textContent = letter;
      span.style.setProperty("--i", index);
      introWord.appendChild(span);
    });

    setTimeout(() => {
      brand.classList.add("finished");
    }, 2300);

    // TELEGRAM AVATAR

    const avatar = document.getElementById("avatar");
    const avatarImage = document.getElementById("avatarImage");
    const photoUrl = tg?.initDataUnsafe?.user?.photo_url;

    if (photoUrl) {
      avatarImage.onload = () => avatar.classList.add("loaded");
      avatarImage.onerror = () => avatar.classList.remove("loaded");
      avatarImage.src = photoUrl;
    }
  </script>
</body>
</html>
