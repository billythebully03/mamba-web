
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Membu Labs</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @font-face {
      font-family: "Super Bubble";
      src: url("./Super Bubble.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --accent: #6A2FE7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      scrollbar-width: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    /* HEADER */

    .header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      height: calc(76px + env(safe-area-inset-top));
      padding: calc(22px + env(safe-area-inset-top)) 20px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: linear-gradient(
        to bottom,
        #000 38%,
        rgba(0,0,0,.96) 60%,
        rgba(0,0,0,.72) 78%,
        transparent
      );
    }

    /* BRAND */

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 32px;
      pointer-events: none;
    }

    .brand-word {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      height: 32px;
      width: var(--intro-width, max-content);
      overflow: hidden;
      transition: width .9s cubic-bezier(.22, 1, .36, 1);
    }

    .intro-text {
      display: flex;
      align-items: center;
      height: 32px;
      white-space: nowrap;
      color: var(--accent);
      font: 22px/1 "Super Bubble", sans-serif;
      transition:
        opacity .65s ease,
        filter .85s ease,
        transform .85s ease;
    }

    .intro-text span,
    .brand-label span {
      display: inline-block;
      opacity: 0;
      transform: translateY(4px);
      filter: blur(2px);
      animation: letter-in .4s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i) * 30ms);
    }

    @keyframes letter-in {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .logo {
      position: absolute;
      left: 0;
      top: 50%;
      width: var(--logo-width, 30px);
      height: 30px;
      background: var(--accent);
      -webkit-mask: url("./membu.png") center / contain no-repeat;
      mask: url("./membu.png") center / contain no-repeat;
      opacity: 0;
      filter: blur(5px);
      transform: translateY(-50%) scale(.96);
      transition:
        opacity .8s ease,
        filter .85s ease,
        transform .85s cubic-bezier(.2, .8, .2, 1);
    }

    .brand-label {
      display: flex;
      align-items: center;
      height: 32px;
      white-space: nowrap;
      color: #fff;
      font: 22px/1 "Super Bubble", sans-serif;
    }

    .brand.finished .brand-word {
      width: var(--logo-width, 30px);
    }

    .brand.finished .intro-text {
      opacity: 0;
      filter: blur(8px);
      transform: translateX(-3px) scale(.985);
    }

    .brand.finished .logo {
      opacity: 1;
      filter: blur(0);
      transform: translateY(-50%) scale(1);
    }

    /* TELEGRAM AVATAR */

    .avatar {
      position: relative;
      width: 34px;
      height: 34px;
      padding: 2px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      overflow: hidden;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      padding: 2px;
      border-radius: 50%;
      background: #000;
      overflow: hidden;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .avatar.loaded .avatar-image {
      opacity: 1;
    }

    .avatar-placeholder {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #292929;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    .avatar.loaded .avatar-placeholder {
      display: none;
    }

    @keyframes shimmer {
      50% {
        background: #383838;
      }
    }

    /* LIQUID GLASS CANVAS */

    #glassCanvas {
      position: fixed;
      inset: 0;
      z-index: 19;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s ease;
    }

    #glassCanvas.visible {
      opacity: 1;
    }

    /* CONTENT */

    main {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(76px + env(safe-area-inset-top)) 20px 60px;
    }

    /* FOOTER */

    .footer {
      position: fixed;
      inset: auto 0 0;
      z-index: 20;
      padding: 0 20px calc(14px + env(safe-area-inset-bottom));

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .footer-label {
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;

      border-radius: 999px;
      background: transparent;
      border: 1px solid transparent;

      color: rgba(255,255,255,.72);
      font-size: 11px;
      line-height: 1;
      letter-spacing: .1px;
      white-space: nowrap;
    }

    .footer-telegram {
      width: 34px;
      height: 34px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: transparent;
      border: 1px solid transparent;

      color: rgba(255,255,255,.88);
      text-decoration: none;

      transition: transform .18s ease;
    }

    .footer-telegram:active {
      transform: scale(.93);
    }

    .footer-telegram svg {
      width: 15px;
      height: 15px;
      display: block;
      fill: currentColor;
    }

    @media (prefers-reduced-motion: reduce) {
      #glassCanvas {
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="brand" id="brand">
      <div class="brand-word" id="brandWord">
        <span class="intro-text" id="introText">MEMBU</span>
        <span class="logo" id="logo"></span>
      </div>

      <span class="brand-label" id="brandLabel">LABS</span>
    </div>

    <div class="avatar" id="avatar">
      <div class="avatar-placeholder"></div>
      <div class="avatar-inner">
        <img id="avatarImage" class="avatar-image" alt="Аватар пользователя">
      </div>
    </div>
  </header>

  <canvas id="glassCanvas"></canvas>

  <main></main>

  <footer class="footer" id="footer">
    <div class="footer-label" id="footerLabel">
      Сделано ibartyom
    </div>

    <a
      class="footer-telegram"
      id="footerTelegram"
      href="https://t.me/ibartyom"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Telegram ibartyom"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.7 4.35a1.5 1.5 0 0 0-1.55-.23L2.5 10.9c-1.2.47-1.18 1.15-.22 1.45l4.53 1.42 1.74 5.4c.21.6.1.84.72.84.48 0 .7-.22.97-.48l2.2-2.14 4.58 3.38c.84.46 1.44.22 1.65-.78l3.01-14.2c.3-1.25-.47-1.82-1.98-1.44ZM8.06 13.45l9.88-6.23c.49-.3.94-.14.57.2l-8.15 7.36-.32 3.44-1.98-4.77Z"/>
      </svg>
    </a>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#000000");
      tg.setBackgroundColor("#000000");
    }

    // INTRO ANIMATION

    const brand = document.getElementById("brand");
    const brandWord = document.getElementById("brandWord");
    const introText = document.getElementById("introText");
    const brandLabel = document.getElementById("brandLabel");

    function splitLetters(element, text, offset = 0) {
      element.textContent = "";

      [...text].forEach((letter, index) => {
        const span = document.createElement("span");
        span.textContent = letter;
        span.style.setProperty("--i", index + offset);
        element.appendChild(span);
      });
    }

    async function startIntro() {
      await document.fonts.load('22px "Super Bubble"');

      splitLetters(introText, "MEMBU");
      splitLetters(brandLabel, "LABS", 6);

      const wordWidth = introText.getBoundingClientRect().width;
      brandWord.style.setProperty("--intro-width", `${wordWidth}px`);

      const logoAsset = new Image();

      logoAsset.onload = () => {
        const width = 30 * logoAsset.naturalWidth / logoAsset.naturalHeight;
        brandWord.style.setProperty("--logo-width", `${width}px`);
      };

      logoAsset.src = "./membu.png";

      setTimeout(() => {
        brand.classList.add("finished");
      }, 2300);
    }

    startIntro();

    // TELEGRAM AVATAR

    const avatar = document.getElementById("avatar");
    const avatarImage = document.getElementById("avatarImage");
    const photoUrl = tg?.initDataUnsafe?.user?.photo_url;

    if (photoUrl) {
      avatarImage.onload = () => avatar.classList.add("loaded");
      avatarImage.onerror = () => avatar.classList.remove("loaded");
      avatarImage.src = photoUrl;
    }

    // LIQUID GLASS

    const canvas = document.getElementById("glassCanvas");
    const footerLabel = document.getElementById("footerLabel");
    const footerTelegram = document.getElementById("footerTelegram");

    let renderer;
    let material;
    let scene;
    let camera;
    let backgroundTexture;
    let glassReady = false;
    let captureInProgress = false;
    let resizeTimer;

    const glass = {
      thickness: 28,
      bezel: 13,
      ior: 2.7,
      blur: 2.2,
      tint: 0.045
    };

    const vertexShader = `
      varying vec2 vUv;

      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      varying vec2 vUv;

      uniform vec2 uResolution;

      uniform vec2 uPillCenter;
      uniform vec2 uPillSize;

      uniform vec2 uCircleCenter;
      uniform vec2 uCircleSize;

      uniform float uThickness;
      uniform float uBezel;
      uniform float uIOR;
      uniform float uBlur;
      uniform float uTint;

      uniform sampler2D uBackground;

      float sdRoundRect(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;

        return min(max(q.x,q.y),0.0)
          + length(max(q,0.0)) - r;
      }

      float shapeDistance(vec2 p, out float shapeIndex) {
        float pill = sdRoundRect(
          p-uPillCenter,
          uPillSize*.5,
          uPillSize.y*.5
        );

        float circle = sdRoundRect(
          p-uCircleCenter,
          uCircleSize*.5,
          uCircleSize.x*.5
        );

        shapeIndex = pill < circle ? 0.0 : 1.0;

        return min(pill,circle);
      }

      float surfaceHeight(float t) {
        float s = 1.0-t;
        return pow(1.0-s*s*s*s,.25);
      }

      vec3 sampleBackground(vec2 uv) {
        return texture2D(uBackground,uv).rgb;
      }

      vec3 blurredBackground(vec2 uv,float radius) {
        vec2 px = 1.0/uResolution;

        vec3 sum = vec3(0.0);

        sum += sampleBackground(uv+vec2(-.8,-.4)*radius*px);
        sum += sampleBackground(uv+vec2(.8,-.7)*radius*px);
        sum += sampleBackground(uv+vec2(-.1,.9)*radius*px);
        sum += sampleBackground(uv+vec2(.4,.3)*radius*px);
        sum += sampleBackground(uv+vec2(-.9,.5)*radius*px);
        sum += sampleBackground(uv+vec2(.7,.8)*radius*px);
        sum += sampleBackground(uv+vec2(.2,-.3)*radius*px);
        sum += sampleBackground(uv+vec2(-.4,-.8)*radius*px);

        return sum/8.0;
      }

      void main() {
        vec2 screenPx = vec2(
          vUv.x,
          1.0-vUv.y
        )*uResolution;

        vec2 uv = screenPx/uResolution;

        float shapeIndex;
        float sd = shapeDistance(screenPx,shapeIndex);

        if (sd > 1.5) {
          gl_FragColor = vec4(0.0);
          return;
        }

        float edgeDistance = max(-sd,0.0);

        float shapeHeight = shapeIndex < .5
          ? uPillSize.y
          : uCircleSize.y;

        float bezel = max(
          1.0,
          min(uBezel,shapeHeight*.46)
        );

        float t = clamp(edgeDistance/bezel,0.0,1.0);

        float h = surfaceHeight(t);

        float dh = (
          surfaceHeight(min(t+.001,1.0))-h
        )/.001;

        float angle = atan(dh*(uThickness/bezel));

        float refractedAngle = asin(
          clamp(sin(angle)/uIOR,-1.0,1.0)
        );

        float displacement = h*uThickness*(
          tan(angle)-tan(refractedAngle)
        );

        float eps = .5;
        float unused;

        vec2 gradient = vec2(
          shapeDistance(screenPx+vec2(eps,0.0),unused)-sd,
          shapeDistance(screenPx+vec2(0.0,eps),unused)-sd
        );

        gradient = normalize(gradient);

        vec2 offset = -gradient*displacement/uResolution;

        vec3 color = blurredBackground(
          uv+offset,
          uBlur
        );

        color = mix(color,vec3(1.0),uTint);

        // Сдержанная кромка без бликов и теней.
        float edge = 1.0-smoothstep(
          0.0,
          1.25,
          edgeDistance
        );

        color += vec3(edge*.055);

        float innerEdge = smoothstep(
          1.0,
          2.0,
          edgeDistance
        )*(1.0-smoothstep(
          2.0,
          3.0,
          edgeDistance
        ));

        color += vec3(innerEdge*.025);

        float alpha = smoothstep(
          0.0,
          1.5,
          edgeDistance
        );

        gl_FragColor = vec4(color,alpha);
      }
    `;

    function initGlass() {
      if (renderer) return;

      renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true
      });

      renderer.setPixelRatio(Math.min(devicePixelRatio,2));
      renderer.setSize(innerWidth,innerHeight);

      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

      const initialTexture = new THREE.DataTexture(
        new Uint8Array([0,0,0,255]),
        1,
        1,
        THREE.RGBAFormat
      );

      initialTexture.needsUpdate = true;
      backgroundTexture = initialTexture;

      material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        transparent: true,
        depthTest: false,
        uniforms: {
          uResolution: {
            value: new THREE.Vector2(
              innerWidth*Math.min(devicePixelRatio,2),
              innerHeight*Math.min(devicePixelRatio,2)
            )
          },

          uPillCenter: { value: new THREE.Vector2() },
          uPillSize: { value: new THREE.Vector2() },

          uCircleCenter: { value: new THREE.Vector2() },
          uCircleSize: { value: new THREE.Vector2() },

          uThickness: { value: glass.thickness },
          uBezel: { value: glass.bezel },
          uIOR: { value: glass.ior },
          uBlur: { value: glass.blur },
          uTint: { value: glass.tint },

          uBackground: { value: initialTexture }
        }
      });

      scene.add(
        new THREE.Mesh(
          new THREE.PlaneGeometry(2,2),
          material
        )
      );

      glassReady = true;
      updateGlassGeometry();
      renderGlass();
    }

    function setElementGeometry(element,centerUniform,sizeUniform,dpr) {
      const rect = element.getBoundingClientRect();

      centerUniform.value.set(
        (rect.left+rect.width/2)*dpr,
        (innerHeight-rect.top-rect.height/2)*dpr
      );

      sizeUniform.value.set(
        rect.width*dpr,
        rect.height*dpr
      );
    }

    function updateGlassGeometry() {
      if (!material) return;

      const dpr = Math.min(devicePixelRatio,2);

      material.uniforms.uResolution.value.set(
        innerWidth*dpr,
        innerHeight*dpr
      );

      setElementGeometry(
        footerLabel,
        material.uniforms.uPillCenter,
        material.uniforms.uPillSize,
        dpr
      );

      setElementGeometry(
        footerTelegram,
        material.uniforms.uCircleCenter,
        material.uniforms.uCircleSize,
        dpr
      );
    }

    function renderGlass() {
      if (!renderer || !glassReady) return;

      renderer.render(scene,camera);
      requestAnimationFrame(renderGlass);
    }

    async function captureBackground() {
      if (!window.html2canvas || !material || captureInProgress) {
        return;
      }

      captureInProgress = true;

      try {
        const dpr = Math.min(devicePixelRatio,2);

        const snapshot = await html2canvas(document.body,{
          backgroundColor: "#000000",
          scale: dpr,
          width: innerWidth,
          height: innerHeight,
          windowWidth: innerWidth,
          windowHeight: innerHeight,
          x: 0,
          y: 0,
          scrollX: 0,
          scrollY: 0,
          useCORS: true,
          logging: false,

          ignoreElements: element =>
            element.id === "glassCanvas" ||
            element.id === "footerLabel" ||
            element.id === "footerTelegram"
        });

        const texture = new THREE.CanvasTexture(snapshot);

        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;
        texture.needsUpdate = true;

        material.uniforms.uBackground.value = texture;

        if (backgroundTexture) {
          backgroundTexture.dispose();
        }

        backgroundTexture = texture;

        material.uniforms.uResolution.value.set(
          snapshot.width,
          snapshot.height
        );

      } catch (error) {
        console.warn(
          "Не удалось создать текстуру для Liquid Glass:",
          error
        );
      } finally {
        captureInProgress = false;
      }
    }

    async function startGlass() {
      initGlass();

      updateGlassGeometry();

      await captureBackground();

      updateGlassGeometry();

      canvas.classList.add("visible");
    }

    window.addEventListener("resize",() => {
      if (!renderer) return;

      const dpr = Math.min(devicePixelRatio,2);

      renderer.setSize(innerWidth,innerHeight);

      material.uniforms.uResolution.value.set(
        innerWidth*dpr,
        innerHeight*dpr
      );

      updateGlassGeometry();

      clearTimeout(resizeTimer);

      resizeTimer = setTimeout(async () => {
        await captureBackground();
        updateGlassGeometry();
      },180);
    });

    // Даём странице и шрифтам завершить первичную отрисовку.
    window.addEventListener("load",() => {
      setTimeout(startGlass,350);
    });

    // Резервный запуск, если load уже произошёл.
    if (document.readyState === "complete") {
      setTimeout(startGlass,350);
    }
  </script>
</body>
</html>
