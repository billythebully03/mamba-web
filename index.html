
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">
  <title>Membu Labs</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @font-face {
      font-family: "Super Bubble";
      src: url("./Super Bubble.ttf") format("truetype");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --background: #000000;
      --text: #ffffff;
      --accent: #6A2FE7;
      --skeleton: #242424;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      -webkit-user-select: none;
      user-select: none;

      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: var(--background);

      overscroll-behavior: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      background: var(--background);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    /* HEADER */

    .header {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;

      width: 100%;
      height: calc(76px + env(safe-area-inset-top));

      padding:
        calc(22px + env(safe-area-inset-top))
        22px
        0;

      display: flex;
      align-items: flex-start;
      justify-content: space-between;

      background: linear-gradient(
        to bottom,
        #000000 0%,
        #000000 38%,
        rgba(0, 0, 0, 0.96) 60%,
        rgba(0, 0, 0, 0.72) 78%,
        rgba(0, 0, 0, 0) 100%
      );

      border: none;
      outline: none;
    }

    /* BRAND */

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;

      height: 32px;
      pointer-events: none;
    }

    .brand-logo {
      display: block;

      width: auto;
      height: 30px;

      object-fit: contain;

      filter: brightness(0) saturate(100%)
        invert(25%) sepia(91%) saturate(3210%)
        hue-rotate(252deg) brightness(92%) contrast(95%);
    }

    .brand-label {
      font-family: "Super Bubble", sans-serif;

      font-size: 22px;
      line-height: 1;

      color: var(--text);
      letter-spacing: 0.2px;

      white-space: nowrap;
    }

    /* TELEGRAM AVATAR */

    .avatar {
      position: relative;

      width: 34px;
      height: 34px;

      flex-shrink: 0;
      border-radius: 50%;

      padding: 2px;

      background: var(--accent);
      overflow: hidden;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;

      border-radius: 50%;
      padding: 2px;

      background: #000000;
      overflow: hidden;
    }

    .avatar-image {
      display: block;

      width: 100%;
      height: 100%;

      border-radius: 50%;
      object-fit: cover;

      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .avatar.loaded .avatar-image {
      opacity: 1;
    }

    .avatar-placeholder {
      position: absolute;
      inset: 4px;

      border-radius: 50%;
      background: var(--skeleton);

      animation: shimmer 1.4s ease-in-out infinite;
    }

    .avatar.loaded .avatar-placeholder {
      display: none;
    }

    @keyframes shimmer {
      0%, 100% {
        background: #242424;
      }

      50% {
        background: #353535;
      }
    }

    /* MAIN CONTENT */

    main {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding-top: calc(76px + env(safe-area-inset-top));
      padding-bottom: calc(44px + env(safe-area-inset-bottom));
    }

    /* FOOTER */

    .footer {
      position: fixed;
      left: 0;
      bottom: 0;
      z-index: 100;

      width: 100%;

      padding:
        0
        20px
        calc(14px + env(safe-area-inset-bottom));

      display: flex;
      justify-content: center;
      align-items: center;

      pointer-events: none;

      color: rgba(255, 255, 255, 0.38);

      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.1px;
      line-height: 1;
    }

    /* MOBILE */

    @media (max-width: 480px) {
      .header {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <div class="brand">
      <img
        src="./membu.png"
        alt="Membu"
        class="brand-logo"
      >

      <span class="brand-label">LABS</span>
    </div>

    <div class="avatar" id="avatar">
      <div class="avatar-placeholder"></div>

      <div class="avatar-inner">
        <img
          class="avatar-image"
          id="avatarImage"
          alt="Аватар пользователя"
        >
      </div>
    </div>

  </header>

  <main>
    <!-- Здесь появится содержимое Membu Labs -->
  </main>

  <footer class="footer">
    Сделано @ibartyom
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      tg.setHeaderColor("#000000");
      tg.setBackgroundColor("#000000");
    }

    // Telegram avatar

    const avatar = document.getElementById("avatar");
    const avatarImage = document.getElementById("avatarImage");

    const photoUrl = tg?.initDataUnsafe?.user?.photo_url;

    if (photoUrl) {
      avatarImage.onload = () => {
        avatar.classList.add("loaded");
      };

      avatarImage.onerror = () => {
        avatar.classList.remove("loaded");
      };

      avatarImage.src = photoUrl;
    }
  </script>

</body>
</html>
