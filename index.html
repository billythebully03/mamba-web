
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Membu Labs</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    @font-face {
      font-family: "Super Bubble";
      src: url("./Super Bubble.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --accent: #6A2FE7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      scrollbar-width: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    /* HEADER */

    .header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      height: calc(76px + env(safe-area-inset-top));
      padding: calc(22px + env(safe-area-inset-top)) 20px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: linear-gradient(
        to bottom,
        #000 38%,
        rgba(0,0,0,.96) 60%,
        rgba(0,0,0,.72) 78%,
        transparent
      );
    }

    /* BRAND */

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 32px;
      pointer-events: none;
    }

    .brand-word {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      height: 32px;
      width: var(--intro-width, max-content);
      overflow: hidden;
      transition: width .9s cubic-bezier(.22, 1, .36, 1);
    }

    .intro-text {
      display: flex;
      align-items: center;
      height: 32px;
      white-space: nowrap;
      color: var(--accent);
      font: 22px/1 "Super Bubble", sans-serif;
      transition:
        opacity .65s ease,
        filter .85s ease,
        transform .85s ease;
    }

    .intro-text span,
    .brand-label span {
      display: inline-block;
      opacity: 0;
      transform: translateY(4px);
      filter: blur(2px);
      animation: letter-in .4s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i) * 30ms);
    }

    @keyframes letter-in {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .logo {
      position: absolute;
      left: 0;
      top: 50%;
      width: var(--logo-width, 30px);
      height: 30px;
      background: var(--accent);
      -webkit-mask: url("./membu.png") center / contain no-repeat;
      mask: url("./membu.png") center / contain no-repeat;
      opacity: 0;
      filter: blur(5px);
      transform: translateY(-50%) scale(.96);
      transition:
        opacity .8s ease,
        filter .85s ease,
        transform .85s cubic-bezier(.2, .8, .2, 1);
    }

    .brand-label {
      display: flex;
      align-items: center;
      height: 32px;
      white-space: nowrap;
      color: #fff;
      font: 22px/1 "Super Bubble", sans-serif;
    }

    .brand.finished .brand-word {
      width: var(--logo-width, 30px);
    }

    .brand.finished .intro-text {
      opacity: 0;
      filter: blur(8px);
      transform: translateX(-3px) scale(.985);
    }

    .brand.finished .logo {
      opacity: 1;
      filter: blur(0);
      transform: translateY(-50%) scale(1);
    }

    /* TELEGRAM AVATAR */

    .avatar {
      position: relative;
      width: 34px;
      height: 34px;
      padding: 2px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      overflow: hidden;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      padding: 2px;
      border-radius: 50%;
      background: #000;
      overflow: hidden;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .avatar.loaded .avatar-image {
      opacity: 1;
    }

    .avatar-placeholder {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #292929;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    .avatar.loaded .avatar-placeholder {
      display: none;
    }

    @keyframes shimmer {
      50% {
        background: #383838;
      }
    }

    /* LIQUID GLASS CANVAS */

    #glassCanvas {
      position: fixed;
      inset: 0;
      z-index: 19;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity .25s ease;
    }

    #glassCanvas.visible {
      opacity: 1;
    }

    /* TOOLTIP CONTENT */

    .welcome-tooltip {
      position: fixed;
      z-index: 21;
      top: calc(66px + env(safe-area-inset-top));
      left: 20px;
      right: 20px;
      height: 78px;

      pointer-events: none;
      opacity: 0;
      visibility: hidden;

      transition:
        opacity .22s ease,
        visibility .22s ease;
    }

    .welcome-tooltip.open {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .welcome-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      padding: 12px 48px 12px 16px;

      color: rgba(255,255,255,.95);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;

      opacity: 0;
      transform: translateY(3px);
      transition:
        opacity .25s ease,
        transform .35s cubic-bezier(.2,.8,.2,1);
    }

    .welcome-tooltip.open .welcome-content {
      opacity: 1;
      transform: translateY(0);
      transition-delay: .22s;
    }

    .welcome-close {
      position: absolute;
      z-index: 2;
      top: 10px;
      right: 10px;

      width: 24px;
      height: 24px;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%;
      background: rgba(0,0,0,.42);
      color: rgba(255,255,255,.8);

      opacity: 0;
      cursor: pointer;
      transition:
        opacity .2s ease,
        background-color .15s ease;
    }

    .welcome-tooltip.open .welcome-close {
      opacity: 1;
      transition-delay: .28s;
    }

    .welcome-close::before,
    .welcome-close::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 1.3px;
      border-radius: 2px;
      background: currentColor;
    }

    .welcome-close::before {
      transform: rotate(45deg);
    }

    .welcome-close::after {
      transform: rotate(-45deg);
    }

    .welcome-close:active {
      background: rgba(0,0,0,.65);
    }

    /* CONTENT */

    main {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(76px + env(safe-area-inset-top)) 20px 60px;
    }

    /* FOOTER */

    .footer {
      position: fixed;
      inset: auto 0 0;
      z-index: 10;
      padding: 0 20px calc(14px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.38);
      line-height: 1;
      pointer-events: none;
    }

    .footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
      pointer-events: auto;
    }

    @media (prefers-reduced-motion: reduce) {
      .welcome-tooltip,
      .welcome-content,
      .welcome-close,
      #glassCanvas {
        transition-duration: .01ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="brand" id="brand">
      <div class="brand-word" id="brandWord">
        <span class="intro-text" id="introText">MEMBU</span>
        <span class="logo" id="logo"></span>
      </div>

      <span class="brand-label" id="brandLabel">LABS</span>
    </div>

    <div class="avatar" id="avatar">
      <div class="avatar-placeholder"></div>
      <div class="avatar-inner">
        <img id="avatarImage" class="avatar-image" alt="Аватар пользователя">
      </div>
    </div>
  </header>

  <canvas id="glassCanvas"></canvas>

  <div class="welcome-tooltip" id="welcomeTooltip">
    <div class="welcome-content">
      Мембу живет здесь, так что ты можешь обратиться к нему в любой момент
    </div>

    <button
      class="welcome-close"
      id="welcomeClose"
      aria-label="Закрыть подсказку"
      type="button"
    ></button>
  </div>

  <main></main>

  <footer class="footer">
    Сделано <a href="https://t.me/ibartyom" target="_blank" rel="noopener noreferrer">@ibartyom</a>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#000000");
      tg.setBackgroundColor("#000000");
    }

    // INTRO ANIMATION

    const brand = document.getElementById("brand");
    const brandWord = document.getElementById("brandWord");
    const introText = document.getElementById("introText");
    const brandLabel = document.getElementById("brandLabel");

    function splitLetters(element, text, offset = 0) {
      element.textContent = "";

      [...text].forEach((letter, index) => {
        const span = document.createElement("span");
        span.textContent = letter;
        span.style.setProperty("--i", index + offset);
        element.appendChild(span);
      });
    }

    async function startIntro() {
      await document.fonts.load('22px "Super Bubble"');

      splitLetters(introText, "MEMBU");
      splitLetters(brandLabel, "LABS", 6);

      const wordWidth = introText.getBoundingClientRect().width;
      brandWord.style.setProperty("--intro-width", `${wordWidth}px`);

      const logoAsset = new Image();

      logoAsset.onload = () => {
        const width = 30 * logoAsset.naturalWidth / logoAsset.naturalHeight;
        brandWord.style.setProperty("--logo-width", `${width}px`);
      };

      logoAsset.src = "./membu.png";

      setTimeout(() => {
        brand.classList.add("finished");
      }, 2300);
    }

    startIntro();

    // TELEGRAM AVATAR

    const avatar = document.getElementById("avatar");
    const avatarImage = document.getElementById("avatarImage");
    const photoUrl = tg?.initDataUnsafe?.user?.photo_url;

    if (photoUrl) {
      avatarImage.onload = () => avatar.classList.add("loaded");
      avatarImage.onerror = () => avatar.classList.remove("loaded");
      avatarImage.src = photoUrl;
    }

    // LIQUID GLASS SHADER

    const canvas = document.getElementById("glassCanvas");
    const tooltip = document.getElementById("welcomeTooltip");
    const closeButton = document.getElementById("welcomeClose");

    let renderer;
    let material;
    let scene;
    let camera;
    let backgroundTexture;
    let animationFrame;
    let glassReady = false;

    const glass = {
      x: 0,
      y: 0,
      width: 0,
      height: 78,
      radius: 19,
      thickness: 62,
      bezel: 48,
      ior: 2.7,
      blur: 2,
      tint: 0.07,
      specular: 0.52
    };

    const vertexShader = `
      varying vec2 vUv;

      void main() {
        vUv = uv;
        gl_Position = vec4(position, 1.0);
      }
    `;

    const fragmentShader = `
      precision highp float;

      varying vec2 vUv;

      uniform vec2 uResolution;
      uniform vec2 uCenter;
      uniform vec2 uSize;
      uniform float uRadius;
      uniform float uThickness;
      uniform float uBezel;
      uniform float uIOR;
      uniform float uBlur;
      uniform float uTint;
      uniform float uSpecular;
      uniform sampler2D uBackground;

      float sdRoundRect(vec2 p, vec2 b, float r) {
        vec2 q = abs(p) - b + r;
        return min(max(q.x, q.y), 0.0)
          + length(max(q, 0.0)) - r;
      }

      float sdTriangle(vec2 p, vec2 a, vec2 b, vec2 c) {
        vec2 e0 = b - a;
        vec2 e1 = c - b;
        vec2 e2 = a - c;

        vec2 v0 = p - a;
        vec2 v1 = p - b;
        vec2 v2 = p - c;

        vec2 pq0 = v0 - e0 * clamp(dot(v0,e0)/dot(e0,e0),0.0,1.0);
        vec2 pq1 = v1 - e1 * clamp(dot(v1,e1)/dot(e1,e1),0.0,1.0);
        vec2 pq2 = v2 - e2 * clamp(dot(v2,e2)/dot(e2,e2),0.0,1.0);

        float s = sign(e0.x*e2.y - e0.y*e2.x);

        vec2 d = min(
          min(
            vec2(dot(pq0,pq0), s*(v0.x*e0.y-v0.y*e0.x)),
            vec2(dot(pq1,pq1), s*(v1.x*e1.y-v1.y*e1.x))
          ),
          vec2(dot(pq2,pq2), s*(v2.x*e2.y-v2.y*e2.x))
        );

        return -sqrt(d.x) * sign(d.y);
      }

      float surfaceHeight(float t) {
        float s = 1.0 - t;
        return pow(1.0 - s*s*s*s, .25);
      }

      vec3 sampleBackground(vec2 uv) {
        return texture2D(uBackground, vec2(uv.x, 1.0-uv.y)).rgb;
      }

      vec3 blurredBackground(vec2 uv, float radius) {
        vec2 px = 1.0 / uResolution;
        vec3 sum = vec3(0.0);

        vec2 offsets[8];
        offsets[0] = vec2(-.8,-.4);
        offsets[1] = vec2(.8,-.7);
        offsets[2] = vec2(-.1,.9);
        offsets[3] = vec2(.4,.3);
        offsets[4] = vec2(-.9,.5);
        offsets[5] = vec2(.7,.8);
        offsets[6] = vec2(.2,-.3);
        offsets[7] = vec2(-.4,-.8);

        for (int i=0; i<8; i++) {
          sum += sampleBackground(uv + offsets[i]*radius*px);
        }

        return sum / 8.0;
      }

      float shapeDistance(vec2 p, vec2 halfSize) {
        float body = sdRoundRect(p, halfSize, uRadius);

        // Хвост — треугольник, плавно объединённый с телом.
        float tail = sdTriangle(
          p,
          vec2(halfSize.x-43.0, -halfSize.y+3.0),
          vec2(halfSize.x-7.0, -halfSize.y+3.0),
          vec2(halfSize.x-25.0, -halfSize.y-15.0)
        );

        float k = 5.0;
        float h = max(k-abs(body-tail), 0.0)/k;
        return min(body,tail) - h*h*k*.25;
      }

      void main() {
        vec2 screenPx = vec2(vUv.x, 1.0-vUv.y)*uResolution;
        vec2 p = screenPx-uCenter;
        vec2 halfSize = uSize*.5;

        float sd = shapeDistance(p,halfSize);

        if (sd > 1.5) {
          gl_FragColor = vec4(0.0);
          return;
        }

        float edgeDistance = max(-sd,0.0);
        float bezel = max(1.0,min(uBezel,min(halfSize.x,halfSize.y)-1.0));
        float t = clamp(edgeDistance/bezel,0.0,1.0);

        float h = surfaceHeight(t);
        float dh = (surfaceHeight(min(t+.001,1.0))-h)/.001;
        float angle = atan(dh*(uThickness/bezel));
        float refractedAngle = asin(clamp(sin(angle)/uIOR,-1.0,1.0));

        float displacement = h*uThickness*(tan(angle)-tan(refractedAngle));

        float eps = .5;
        vec2 grad = vec2(
          shapeDistance(p+vec2(eps,0.0),halfSize)-sd,
          shapeDistance(p+vec2(0.0,eps),halfSize)-sd
        );
        grad = normalize(grad);

        vec2 offset = -grad*displacement/uResolution;
        vec2 uv = screenPx/uResolution;

        vec3 color = blurredBackground(uv+offset,uBlur);

        // Очень деликатная тонировка iOS Liquid.
        color = mix(color,vec3(1.0),uTint);

        // Тонкая кромка, без широкого блика.
        float edge = 1.0-smoothstep(0.0,1.15,edgeDistance);
        color += vec3(edge*uSpecular*.34);

        float innerRim = smoothstep(.35,1.2,edgeDistance)
          *(1.0-smoothstep(1.2,2.1,edgeDistance));
        color += vec3(innerRim*.055*uSpecular);

        float alpha = smoothstep(0.0,1.5,edgeDistance);

        gl_FragColor = vec4(color,alpha);
      }
    `;

    function initGlass() {
      if (renderer) return;

      renderer = new THREE.WebGLRenderer({
        canvas,
        alpha: true,
        antialias: true
      });

      renderer.setPixelRatio(Math.min(devicePixelRatio,2));
      renderer.setSize(innerWidth,innerHeight);

      scene = new THREE.Scene();
      camera = new THREE.OrthographicCamera(-1,1,1,-1,0,1);

      const texture = new THREE.DataTexture(
        new Uint8Array([0,0,0,255]),
        1,
        1,
        THREE.RGBAFormat
      );
      texture.needsUpdate = true;
      backgroundTexture = texture;

      material = new THREE.ShaderMaterial({
        vertexShader,
        fragmentShader,
        transparent: true,
        depthTest: false,
        uniforms: {
          uResolution: { value: new THREE.Vector2(innerWidth,innerHeight) },
          uCenter: { value: new THREE.Vector2() },
          uSize: { value: new THREE.Vector2() },
          uRadius: { value: glass.radius },
          uThickness: { value: glass.thickness },
          uBezel: { value: glass.bezel },
          uIOR: { value: glass.ior },
          uBlur: { value: glass.blur },
          uTint: { value: glass.tint },
          uSpecular: { value: glass.specular },
          uBackground: { value: texture }
        }
      });

      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),material));

      glassReady = true;
      updateGlassGeometry();
      renderGlass();
    }

    function updateGlassGeometry() {
      if (!material) return;

      const rect = tooltip.getBoundingClientRect();
      const dpr = Math.min(devicePixelRatio,2);

      glass.width = rect.width;
      glass.height = rect.height;

      material.uniforms.uResolution.value.set(
        innerWidth*dpr,
        innerHeight*dpr
      );

      material.uniforms.uCenter.value.set(
        (rect.left+rect.width/2)*dpr,
        (rect.top+rect.height/2)*dpr
      );

      material.uniforms.uSize.value.set(
        rect.width*dpr,
        rect.height*dpr
      );

      material.uniforms.uRadius.value = glass.radius*dpr;
      material.uniforms.uThickness.value = glass.thickness*dpr;
      material.uniforms.uBezel.value = glass.bezel*dpr;
    }

    function renderGlass() {
      if (!renderer || !glassReady) return;

      renderer.render(scene,camera);
      animationFrame = requestAnimationFrame(renderGlass);
    }

    async function captureBackground() {
      if (!window.html2canvas) return;

      try {
        const snapshot = await html2canvas(document.body,{
          backgroundColor: "#000000",
          scale: Math.min(devicePixelRatio,2),
          useCORS: true,
          logging: false,
          ignoreElements: element =>
            element.id === "glassCanvas" ||
            element.id === "welcomeTooltip"
        });

        const texture = new THREE.CanvasTexture(snapshot);
        texture.minFilter = THREE.LinearFilter;
        texture.magFilter = THREE.LinearFilter;
        texture.generateMipmaps = false;

        material.uniforms.uBackground.value = texture;

        if (backgroundTexture) backgroundTexture.dispose();
        backgroundTexture = texture;
      } catch (error) {
        console.warn("Не удалось получить фон для Liquid Glass:",error);
      }
    }

    async function openTooltip() {
      initGlass();

      // Сначала фиксируем исходную позицию у аватара.
      const avatarRect = avatar.getBoundingClientRect();

      tooltip.style.top = `${avatarRect.top+avatarRect.height+10}px`;
      tooltip.style.height = "34px";

      await captureBackground();

      tooltip.style.top = `calc(66px + env(safe-area-inset-top))`;
      tooltip.style.height = "78px";

      requestAnimationFrame(() => {
        updateGlassGeometry();
        canvas.classList.add("visible");
        tooltip.classList.add("open");
      });

      // Обновляем геометрию по мере раскрытия.
      const start = performance.now();
      const duration = 520;

      function animateGeometry(now) {
        const progress = Math.min((now-start)/duration,1);
        updateGlassGeometry();

        if (progress < 1) {
          requestAnimationFrame(animateGeometry);
        }
      }

      requestAnimationFrame(animateGeometry);
    }

    function closeTooltip() {
      tooltip.classList.remove("open");
      canvas.classList.remove("visible");
    }

    closeButton.addEventListener("click",closeTooltip);

    window.addEventListener("resize",() => {
      if (!renderer) return;

      renderer.setSize(innerWidth,innerHeight);
      updateGlassGeometry();
    });

    setTimeout(openTooltip,450);
  </script>
</body>
</html>
