<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Membu Labs</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @font-face {
      font-family: "Super Bubble";
      src: url("./Super Bubble.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --accent: #6A2FE7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      scrollbar-width: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    /* HEADER */

    .header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      height: calc(76px + env(safe-area-inset-top));
      padding: calc(22px + env(safe-area-inset-top)) 20px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: linear-gradient(
        to bottom,
        #000 38%,
        rgba(0,0,0,.96) 60%,
        rgba(0,0,0,.72) 78%,
        transparent
      );
    }

    /* BRAND */

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      height: 32px;
      pointer-events: none;
    }

    .brand-word {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      height: 32px;
      width: var(--intro-width, max-content);
      overflow: hidden;
      transition: width .9s cubic-bezier(.22, 1, .36, 1);
    }

    .intro-text {
      display: flex;
      align-items: center;
      height: 32px;
      white-space: nowrap;
      color: var(--accent);
      font: 22px/1 "Super Bubble", sans-serif;
      transition:
        opacity .65s ease,
        filter .85s ease,
        transform .85s ease;
    }

    .intro-text span,
    .brand-label span {
      display: inline-block;
      opacity: 0;
      transform: translateY(4px);
      filter: blur(2px);
      animation: letter-in .4s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i) * 30ms);
    }

    @keyframes letter-in {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .logo {
      position: absolute;
      left: 0;
      top: 50%;
      width: var(--logo-width, 30px);
      height: 30px;
      background: var(--accent);
      -webkit-mask: url("./membu.png") center / contain no-repeat;
      mask: url("./membu.png") center / contain no-repeat;
      opacity: 0;
      filter: blur(5px);
      transform: translateY(-50%) scale(.96);
      transition:
        opacity .8s ease,
        filter .85s ease,
        transform .85s cubic-bezier(.2, .8, .2, 1);
    }

    .brand-label {
      display: flex;
      align-items: center;
      height: 32px;
      white-space: nowrap;
      color: #fff;
      font: 22px/1 "Super Bubble", sans-serif;
    }

    .brand.finished .brand-word {
      width: var(--logo-width, 30px);
    }

    .brand.finished .intro-text {
      opacity: 0;
      filter: blur(8px);
      transform: translateX(-3px) scale(.985);
    }

    .brand.finished .logo {
      opacity: 1;
      filter: blur(0);
      transform: translateY(-50%) scale(1);
    }

    /* TELEGRAM AVATAR */

    .avatar {
      position: relative;
      width: 34px;
      height: 34px;
      padding: 2px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      overflow: hidden;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      padding: 2px;
      border-radius: 50%;
      background: #000;
      overflow: hidden;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .avatar.loaded .avatar-image {
      opacity: 1;
    }

    .avatar-placeholder {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #292929;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    .avatar.loaded .avatar-placeholder {
      display: none;
    }

    @keyframes shimmer {
      50% {
        background: #383838;
      }
    }

    /* WELCOME TOOLTIP */

    .welcome-tooltip {
      position: fixed;
      z-index: 20;
      top: calc(22px + env(safe-area-inset-top));
      right: 20px;

      width: 34px;
      height: 34px;
      padding: 0;

      border: 1px solid rgba(255,255,255,.17);
      border-radius: 50%;
      background: rgba(24,22,32,.58);

      -webkit-backdrop-filter: blur(2px) saturate(145%);
      backdrop-filter: blur(2px) saturate(145%);

      opacity: 0;
      overflow: visible;
      isolation: isolate;
      pointer-events: none;

      transition:
        width .95s cubic-bezier(.22, 1, .36, 1),
        height .85s cubic-bezier(.22, 1, .36, 1),
        top .95s cubic-bezier(.22, 1, .36, 1),
        border-radius .8s cubic-bezier(.22, 1, .36, 1),
        opacity .35s ease,
        background-color .6s ease;
    }

    /* Небольшой хвостик, направленный к аватару */

    .welcome-tooltip::before {
      content: "";
      position: absolute;
      z-index: 0;
      top: -7px;
      right: 10px;

      width: 14px;
      height: 14px;

      background: rgba(24,22,32,.76);
      border-top: 1px solid rgba(255,255,255,.17);
      border-left: 1px solid rgba(255,255,255,.17);
      border-radius: 3px 0 0 0;

      transform: rotate(45deg);
      opacity: 0;
      transition: opacity .25s ease .25s;
    }

    .welcome-content {
      position: absolute;
      inset: 0;
      z-index: 1;

      display: flex;
      align-items: center;

      padding: 17px 48px 17px 18px;

      color: rgba(255,255,255,.94);
      font-size: 14px;
      font-weight: 400;
      line-height: 1.4;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity .3s ease,
        visibility .3s ease;
    }

    .welcome-close {
      position: absolute;
      z-index: 2;
      top: 12px;
      right: 12px;

      width: 24px;
      height: 24px;
      padding: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%;
      background: rgba(0,0,0,.34);
      color: rgba(255,255,255,.8);

      -webkit-backdrop-filter: none;
      backdrop-filter: none;

      opacity: 0;
      visibility: hidden;
      cursor: pointer;

      transition:
        opacity .25s ease,
        background-color .2s ease,
        visibility .25s ease;
    }

    .welcome-close::before,
    .welcome-close::after {
      content: "";
      position: absolute;
      width: 10px;
      height: 1.3px;
      border-radius: 2px;
      background: currentColor;
    }

    .welcome-close::before {
      transform: rotate(45deg);
    }

    .welcome-close::after {
      transform: rotate(-45deg);
    }

    .welcome-close:active {
      background: rgba(0,0,0,.52);
    }

    /* OPEN STATE */

    .welcome-tooltip.open {
      top: calc(66px + env(safe-area-inset-top));
      width: calc(100vw - 40px);
      height: 112px;
      border-radius: 22px;
      opacity: 1;
      pointer-events: auto;
    }

    .welcome-tooltip.open::before {
      opacity: 1;
    }

    .welcome-tooltip.open .welcome-content {
      opacity: 1;
      visibility: visible;
      transition-delay: .42s;
    }

    .welcome-tooltip.open .welcome-close {
      opacity: 1;
      visibility: visible;
      transition-delay: .48s;
    }

    /* CONTENT */

    main {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(76px + env(safe-area-inset-top)) 20px 60px;
    }

    /* FOOTER */

    .footer {
      position: fixed;
      inset: auto 0 0;
      z-index: 10;
      padding: 0 20px calc(14px + env(safe-area-inset-bottom));
      text-align: center;
      font-size: 11px;
      color: rgba(255,255,255,.38);
      line-height: 1;
      pointer-events: none;
    }

    .footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 2px;
      pointer-events: auto;
    }

    /* REDUCED MOTION */

    @media (prefers-reduced-motion: reduce) {
      .welcome-tooltip,
      .welcome-tooltip::before,
      .welcome-content,
      .welcome-close {
        transition-duration: .01ms !important;
        transition-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="brand" id="brand">
      <div class="brand-word" id="brandWord">
        <span class="intro-text" id="introText">MEMBU</span>
        <span class="logo" id="logo"></span>
      </div>

      <span class="brand-label" id="brandLabel">LABS</span>
    </div>

    <div class="avatar" id="avatar">
      <div class="avatar-placeholder"></div>
      <div class="avatar-inner">
        <img id="avatarImage" class="avatar-image" alt="Аватар пользователя">
      </div>
    </div>
  </header>

  <!-- WELCOME TOOLTIP -->

  <div class="welcome-tooltip" id="welcomeTooltip">
    <div class="welcome-content">
      Мембу живет здесь, так что ты можешь обратиться к нему в любой момент
    </div>

    <button
      class="welcome-close"
      id="welcomeClose"
      aria-label="Закрыть подсказку"
      type="button"
    ></button>
  </div>

  <main></main>

  <footer class="footer">
    Сделано <a href="https://t.me/ibartyom" target="_blank" rel="noopener noreferrer">@ibartyom</a>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#000000");
      tg.setBackgroundColor("#000000");
    }

    // INTRO ANIMATION

    const brand = document.getElementById("brand");
    const brandWord = document.getElementById("brandWord");
    const introText = document.getElementById("introText");
    const brandLabel = document.getElementById("brandLabel");

    function splitLetters(element, text, offset = 0) {
      element.textContent = "";

      [...text].forEach((letter, index) => {
        const span = document.createElement("span");
        span.textContent = letter;
        span.style.setProperty("--i", index + offset);
        element.appendChild(span);
      });
    }

    async function startIntro() {
      await document.fonts.load('22px "Super Bubble"');

      splitLetters(introText, "MEMBU");
      splitLetters(brandLabel, "LABS", 6);

      const wordWidth = introText.getBoundingClientRect().width;
      brandWord.style.setProperty("--intro-width", `${wordWidth}px`);

      const logoAsset = new Image();

      logoAsset.onload = () => {
        const width = 30 * logoAsset.naturalWidth / logoAsset.naturalHeight;
        brandWord.style.setProperty("--logo-width", `${width}px`);
      };

      logoAsset.src = "./membu.png";

      // Пауза после появления всей надписи
      setTimeout(() => {
        brand.classList.add("finished");
      }, 2300);
    }

    startIntro();

    // TELEGRAM AVATAR

    const avatar = document.getElementById("avatar");
    const avatarImage = document.getElementById("avatarImage");
    const photoUrl = tg?.initDataUnsafe?.user?.photo_url;

    if (photoUrl) {
      avatarImage.onload = () => avatar.classList.add("loaded");
      avatarImage.onerror = () => avatar.classList.remove("loaded");
      avatarImage.src = photoUrl;
    }

    // WELCOME TOOLTIP

    const welcomeTooltip = document.getElementById("welcomeTooltip");
    const welcomeClose = document.getElementById("welcomeClose");

    // Небольшая задержка перед появлением
    setTimeout(() => {
      welcomeTooltip.classList.add("open");
    }, 650);

    // Закрытие с обратной анимацией
    welcomeClose.addEventListener("click", () => {
      welcomeTooltip.classList.remove("open");
    });
  </script>
</body>
</html>
