
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Membu Labs</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @font-face {
      font-family: "Super Bubble";
      src: url("./Super Bubble.ttf") format("truetype");
      font-display: swap;
    }

    :root {
      --accent: #6A2FE7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overscroll-behavior: none;
      scrollbar-width: none;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    /* HEADER */

    .header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 10;
      height: calc(80px + env(safe-area-inset-top));
      padding: calc(23px + env(safe-area-inset-top)) 21px 0;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      background: linear-gradient(
        to bottom,
        #000 38%,
        rgba(0,0,0,.96) 60%,
        rgba(0,0,0,.72) 78%,
        transparent
      );
    }

    /* BRAND */

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      height: 34px;
      pointer-events: none;
    }

    .brand-word {
      position: relative;
      display: flex;
      align-items: center;
      flex: 0 0 auto;
      height: 34px;
      width: var(--intro-width, max-content);
      overflow: hidden;
      transition: width .9s cubic-bezier(.22, 1, .36, 1);
    }

    .intro-text {
      display: flex;
      align-items: center;
      height: 34px;
      white-space: nowrap;
      color: var(--accent);
      font: 23px/1 "Super Bubble", sans-serif;
      transition:
        opacity .65s ease,
        filter .85s ease,
        transform .85s ease;
    }

    .intro-text span,
    .brand-label span {
      display: inline-block;
      opacity: 0;
      transform: translateY(4px);
      filter: blur(2px);
      animation: letter-in .4s cubic-bezier(.2, .8, .2, 1) forwards;
      animation-delay: calc(var(--i) * 30ms);
    }

    @keyframes letter-in {
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    .logo {
      position: absolute;
      left: 0;
      top: 50%;
      width: var(--logo-width, 32px);
      height: 32px;
      background: var(--accent);
      -webkit-mask: url("./membu.png") center / contain no-repeat;
      mask: url("./membu.png") center / contain no-repeat;
      opacity: 0;
      filter: blur(5px);
      transform: translateY(-50%) scale(.96);
      transition:
        opacity .8s ease,
        filter .85s ease,
        transform .85s cubic-bezier(.2, .8, .2, 1);
    }

    .brand-label {
      display: flex;
      align-items: center;
      height: 34px;
      white-space: nowrap;
      color: #fff;
      font: 23px/1 "Super Bubble", sans-serif;
    }

    .brand.finished .brand-word {
      width: var(--logo-width, 32px);
    }

    .brand.finished .intro-text {
      opacity: 0;
      filter: blur(8px);
      transform: translateX(-3px) scale(.985);
    }

    .brand.finished .logo {
      opacity: 1;
      filter: blur(0);
      transform: translateY(-50%) scale(1);
    }

    /* TELEGRAM AVATAR */

    .avatar {
      position: relative;
      width: 36px;
      height: 36px;
      padding: 2px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--accent);
      overflow: hidden;
    }

    .avatar-inner {
      width: 100%;
      height: 100%;
      padding: 2px;
      border-radius: 50%;
      background: #000;
      overflow: hidden;
    }

    .avatar-image {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      opacity: 0;
      transition: opacity .2s ease;
    }

    .avatar.loaded .avatar-image {
      opacity: 1;
    }

    .avatar-placeholder {
      position: absolute;
      inset: 4px;
      border-radius: 50%;
      background: #292929;
      animation: shimmer 1.4s ease-in-out infinite;
    }

    .avatar.loaded .avatar-placeholder {
      display: none;
    }

    @keyframes shimmer {
      50% {
        background: #383838;
      }
    }

    /* CONTENT */

    main {
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(80px + env(safe-area-inset-top)) 21px 60px;
    }

    /* FOOTER */

    .footer {
      position: fixed;
      inset: auto 0 0;
      z-index: 20;
      padding: 0 20px calc(16px + env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,.65);
      font-size: 12px;
      line-height: 1.4;
      letter-spacing: .1px;
    }

    .footer-username {
      margin-left: 3px;
      color: rgba(255,255,255,.9);
      text-decoration: underline;
      text-decoration-color: rgba(255,255,255,.5);
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      transition: opacity .18s ease;
    }

    .footer-username:active {
      opacity: .6;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="brand" id="brand">
      <div class="brand-word" id="brandWord">
        <span class="intro-text" id="introText">MEMBU</span>
        <span class="logo" id="logo"></span>
      </div>

      <span class="brand-label" id="brandLabel">LABS</span>
    </div>

    <div class="avatar" id="avatar">
      <div class="avatar-placeholder"></div>
      <div class="avatar-inner">
        <img id="avatarImage" class="avatar-image" alt="Аватар пользователя">
      </div>
    </div>
  </header>

  <main></main>

  <footer class="footer">
    <span>Сделано</span>
    <a
      class="footer-username"
      href="https://t.me/ibartyom"
      target="_blank"
      rel="noopener noreferrer"
    >ibartyom</a>
  </footer>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
      tg.setHeaderColor("#000000");
      tg.setBackgroundColor("#000000");
    }

    // INTRO ANIMATION

    const brand = document.getElementById("brand");
    const brandWord = document.getElementById("brandWord");
    const introText = document.getElementById("introText");
    const brandLabel = document.getElementById("brandLabel");

    function splitLetters(element, text, offset = 0) {
      element.textContent = "";

      [...text].forEach((letter, index) => {
        const span = document.createElement("span");
        span.textContent = letter;
        span.style.setProperty("--i", index + offset);
        element.appendChild(span);
      });
    }

    async function startIntro() {
      await document.fonts.load('23px "Super Bubble"');

      splitLetters(introText, "MEMBU");
      splitLetters(brandLabel, "LABS", 6);

      const wordWidth = introText.getBoundingClientRect().width;
      brandWord.style.setProperty("--intro-width", `${wordWidth}px`);

      const logoAsset = new Image();

      logoAsset.onload = () => {
        const width = 32 * logoAsset.naturalWidth / logoAsset.naturalHeight;
        brandWord.style.setProperty("--logo-width", `${width}px`);
      };

      logoAsset.src = "./membu.png";

      setTimeout(() => {
        brand.classList.add("finished");
      }, 2300);
    }

    startIntro();

    // TELEGRAM AVATAR

    const avatar = document.getElementById("avatar");
    const avatarImage = document.getElementById("avatarImage");
    const photoUrl = tg?.initDataUnsafe?.user?.photo_url;

    if (photoUrl) {
      avatarImage.onload = () => avatar.classList.add("loaded");
      avatarImage.onerror = () => avatar.classList.remove("loaded");
      avatarImage.src = photoUrl;
    }
  </script>
</body>
</html>
