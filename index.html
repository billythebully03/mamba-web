
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#000000">
  <title>Membu Labs</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    @font-face {
      font-family: "Super Bubble";
      src: url("./SuperBubble-Regular.woff2") format("woff2");
      font-weight: normal;
      font-style: normal;
      font-display: swap;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;

      -webkit-user-select: none;
      user-select: none;

      -webkit-tap-highlight-color: transparent;
    }

    html {
      width: 100%;
      min-height: 100%;
      background: #000;

      overscroll-behavior: none;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      background: #000;
      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        sans-serif;

      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    /* HEADER */

    .header {
      position: fixed;
      top: 0;
      left: 0;

      z-index: 100;

      width: 100%;
      height: calc(76px + env(safe-area-inset-top));

      padding:
        calc(22px + env(safe-area-inset-top))
        22px
        0;

      display: flex;
      align-items: flex-start;
      justify-content: flex-start;

      background: linear-gradient(
        to bottom,
        #000 0%,
        #000 38%,
        rgba(0, 0, 0, 0.96) 60%,
        rgba(0, 0, 0, 0.72) 78%,
        rgba(0, 0, 0, 0) 100%
      );

      border: none;
      outline: none;

      pointer-events: none;
    }

    /* BRAND */

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;

      height: 32px;
    }

    .brand-logo {
      display: block;

      width: auto;
      height: 30px;

      object-fit: contain;
    }

    .brand-label {
      font-family: "Super Bubble", sans-serif;

      font-size: 22px;
      line-height: 1;

      color: #fff;
      letter-spacing: 0.2px;

      white-space: nowrap;
    }

    /* MAIN CONTENT */

    main {
      position: relative;

      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;

      padding-top: calc(76px + env(safe-area-inset-top));
    }

    /* MOBILE */

    @media (max-width: 480px) {
      .header {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="brand">
      <img
        src="./membu.png"
        alt="Membu"
        class="brand-logo"
      >

      <span class="brand-label">LABS</span>
    </div>
  </header>

  <main>
    <!-- Здесь появится содержимое Membu Labs -->
  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      tg.setHeaderColor("#000000");
      tg.setBackgroundColor("#000000");
    }
  </script>

</body>
</html>
